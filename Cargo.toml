[package]
name = "crystal-server"
version = "0.1.1"
edition = "2024"
authors = ["ryi3r <ryi3r@duck.com>"]

license-file = "LICENSE"
description = "The client of a back-end provider to create multiplayer games."
homepage = "https://crystal-server.co"
repository = "https://github.com/Crystal-Server/rust-client.git"
readme = "README.md"
keywords = ["multiplayer", "service"]
include = ["LICENSE", "Cargo.toml", "src/**/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["lib"]

[features]
default = []
__dev = ["dep:tracing", "dep:tracing-subscriber"]
__local = ["wtransport/dangerous-configuration"]

[dependencies]
bstr = "1.12.0"
num_enum = "0.7.4"
chrono = "0.4.42"
byteorder = "1.5.0"
integer-hasher = "0.1.1"
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.20", optional = true }
tokio-tungstenite = "0.27.0"
tokio = { version = "1.47.1", features = [
    "net",
    "rt",
    "sync",
    "time",
    "macros",
] }
bytes = "1.10.1"
futures-util = { version = "0.3.31", features = ["io"] }
machineid-crystal = "1.2.6"
async-stream = "0.3.6"
urlencoding = "2.1.3"
serde = "1.0.226"
bitflags = "2.9.4"
wtransport = "0.6.1"
